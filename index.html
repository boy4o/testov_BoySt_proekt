<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Промо Оферти - Сравнение на Цени</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --billa-color: #f5c518;
            --lidl-color: #0050aa;
            --kaufland-color: #e50000;
            --fantastico-color: #009b3a;
        }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }
        .page { display: none; }
        .page.active { display: block; }
        .highlight-green { background-color: #e6fffa; color: #1a744f; font-weight: 600; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white; padding: 2rem; border-radius: 0.5rem;
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
        }
        .ad-banner {
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        .billa-text { color: var(--billa-color); }
        .lidl-text { color: var(--lidl-color); }
        .kaufland-text { color: var(--kaufland-color); }
        .fantastico-text { color: var(--fantastico-color); }
        
        .cta-button {
            transition: transform 0.2s ease-in-out, background-color 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px) scale(1.05);
        }
        .nav-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #e5e7eb;
            transition: transform 0.2s ease-in-out, background-color 0.2s, border-color 0.2s;
        }
        .nav-button:hover {
            transform: translateY(-2px);
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }
        .nav-button .icon {
            width: 1.5rem;
            height: 1.5rem;
        }
        .table-fixed td {
            word-wrap: break-word;
        }
    </style>
</head>

    { name: "Замразени Храни", icon: `<img src="https://img.icons8.com/color/48/000000/ice-crystal.png" alt="Замразени храни" class="icon"/>`, products: [] },
    { name: "Кафе и Чай", icon: `<img src="https://img.icons8.com/color/48/000000/coffee-to-go.png" alt="Кафе и чай" class="icon"/>`, products: [] },
    { name: "Безалкохолни", icon: `<img src="https://img.icons8.com/color/48/000000/soda-can.png" alt="Безалкохолни" class="icon"/>`, products: [] },
    { name: "Сладкиши и Десерти", icon: `<img src="https://img.icons8.com/color/48/000000/cupcake.png" alt="Сладкиши" class="icon"/>`, products: [] },

    { name: "Алкохолни Напитки", icon: `<img src="https://img.icons8.com/color/48/000000/wine-bottle.png" alt="Алкохол" class="icon"/>`, products: [] }

};

// --- СЪСТОЯНИЕ НА ПРИЛОЖЕНИЕТО ---
let shoppingList = {};
let currentPage = 'home';
let currentCategory = null;

// --- ОСНОВНИ ФУНКЦИИ ---
document.addEventListener('DOMContentLoaded', () => {
    populateNavigation();
    populateTopOffers();
    populateGlobalFooterStats();
    showPage('home');
    updateShoppingListCount();
});

function showPage(pageId, categoryName = null) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`${pageId}-page`).classList.add('active');
    currentPage = pageId;
    window.scrollTo(0, 0);

    if (pageId === 'category') {
        currentCategory = mockData.categories.find(c => c.name === categoryName);
        if (currentCategory) {
            document.getElementById('category-title').textContent = currentCategory.name;
            document.getElementById('search-box').value = '';
            populateCategoryTable(currentCategory);
        }
    } else {
        currentCategory = null;
    }
}

function populateNavigation() {
    const navUl = document.querySelector('#main-nav ul');
    navUl.innerHTML = '';
    mockData.categories.forEach(category => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="#" onclick="showPage('category', '${category.name}')" class="nav-button text-gray-700 text-sm font-medium">
                            ${category.icon}
                            <span class="hidden md:inline">${category.name}</span>
                        </a>`;
        navUl.appendChild(li);
    });
}

function populateTopOffers() {
    const container = document.getElementById('top-offers-container');
    container.innerHTML = '';
    const allProducts = mockData.categories.flatMap(c => c.products);
    const sortedOffers = allProducts
        .map(p => ({ ...p, bestOffer: getBestOffer(p.offers) }))
        .filter(p => p.bestOffer.price !== Infinity)
        .sort((a, b) => a.bestOffer.price - b.bestOffer.price)
        .slice(0, 6);

    sortedOffers.forEach(product => {
        const storeColorClass = mockData.supermarketColors[product.bestOffer.store];
        const offerDiv = document.createElement('div');
        offerDiv.className = 'bg-gray-50 border border-gray-200 p-4 rounded-lg text-left transform transition-transform hover:scale-105 hover:shadow-md';
        offerDiv.innerHTML = `
            <h3 class="font-semibold text-lg">${product.productName}</h3>
            <p class="text-sm text-gray-500 mb-2">${product.description}</p>
            <p class="text-2xl font-bold text-teal-600">${product.bestOffer.price.toFixed(2)} лв.</p>
            <p class="text-sm font-semibold ${storeColorClass}-text">в ${product.bestOffer.store}</p>
        `;
        container.appendChild(offerDiv);
    });
}

function populateCategoryTable(category) {
    const tableHead = document.getElementById('table-head');
    const tableBody = document.getElementById('table-body');
    const footer = document.getElementById('category-footer');
    
    let headHTML = '<tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/3">Продукт</th>';
    mockData.supermarkets.forEach(sm => {
        const validity = getBrochureValidityForStore(category, sm);
        const colorClass = mockData.supermarketColors[sm] + '-text';
        headHTML += `<th class="px-3 py-3 text-left text-xs font-bold uppercase tracking-wider w-auto md:w-1/6 ${colorClass}">
            ${sm}<br><span class="font-normal normal-case text-gray-500">${validity}</span>
        </th>`;
    });
    headHTML += '<th class="px-2 py-3 w-12"></th></tr>';
    tableHead.innerHTML = headHTML;

    tableBody.innerHTML = '';
    (category.products || []).forEach(product => {
        const bestOffer = getBestOffer(product.offers);
        let rowHTML = `<tr data-product-name="${product.productName.toLowerCase()}">
            <td class="px-4 py-4">
                <div class="font-medium text-gray-900">${product.productName}</div>
                <div class="text-sm text-gray-500">${product.description}</div>
            </td>`;
        
        mockData.supermarkets.forEach(sm => {
            const offer = product.offers[sm];
            const isBest = offer && offer.promoPrice === bestOffer.price;
            rowHTML += `<td class="px-3 py-4 ${isBest ? 'highlight-green' : ''}">`;
            if (offer && offer.promoPrice) {
                 const unitPrice = calculateUnitPrice(offer.promoPrice, product.description);
                rowHTML += `<div class="text-lg font-semibold">${offer.promoPrice.toFixed(2)} лв.</div>
                            ${unitPrice ? `<div class="text-sm text-gray-500">${unitPrice}</div>` : ''}
                            ${offer.loyaltyCard ? `<div class="flex items-center text-xs text-blue-600 mt-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V4zm3 0a1 1 0 00-1 1v1a1 1 0 001 1h2a1 1 0 001-1V5a1 1 0 00-1-1H8z" /></svg>С карта</div>` : ''}
                            ${offer.notes ? `<div class="text-xs text-gray-500 italic mt-1">${offer.notes}</div>` : ''}
                            `;
            } else { rowHTML += '<span class="text-gray-400">-</span>'; }
            rowHTML += '</td>';
        });

        rowHTML += `<td class="px-2 py-4 text-right">
            <button onclick="addToShoppingList('${product.productId}')" class="bg-teal-500 text-white p-2 rounded-full hover:bg-teal-600 cta-button" title="Добави в списъка">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
            </button>
        </td></tr>`;
        tableBody.innerHTML += rowHTML;
    });

    const productsInCategory = (category.products || []).length;
    let footerHTML = `<p class="mb-2">Показани ${productsInCategory} продукта от категория "${category.name}".</p>`;
    if (productsInCategory > 0) {
        const storeCounts = {};
        mockData.supermarkets.forEach(sm => storeCounts[sm] = 0);
        category.products.forEach(p => {
            mockData.supermarkets.forEach(sm => {
                if (p.offers[sm]) storeCounts[sm]++;
            });
        });
        footerHTML += `<div class="flex justify-center flex-wrap gap-4 text-xs">`;
        mockData.supermarkets.forEach(sm => {
            if(storeCounts[sm] > 0) {
                const colorClass = mockData.supermarketColors[sm] + '-text';
                footerHTML += `<span class="font-semibold ${colorClass}">${sm}: ${storeCounts[sm]}</span>`;
            }
        });
        footerHTML += `</div>`;
    }
    footer.innerHTML = footerHTML;
}

// --- СТАТИСТИКИ ---
function populateGlobalFooterStats() {
    const footer = document.getElementById('global-stats-footer');
    
    const storeCounts = {};
    mockData.supermarkets.forEach(sm => storeCounts[sm] = 0);
    mockData.categories.forEach(cat => {
        (cat.products || []).forEach(p => {
            mockData.supermarkets.forEach(sm => {
                if (p.offers[sm] && p.offers[sm].promoPrice) {
                    storeCounts[sm]++;
                }
            });
        });
    });

    let statsHTML = '<h3 class="text-xl font-bold text-center mb-4">Общ брой продукти в промоция</h3>';
    statsHTML += `<div class="flex justify-around items-center bg-gray-50 p-4 rounded-lg mb-6">`;
    mockData.supermarkets.forEach(sm => {
        const colorClass = mockData.supermarketColors[sm] + '-text';
        statsHTML += `
            <div class="text-center">
                <p class="font-bold text-lg ${colorClass}">${sm}</p>
                <p class="text-xl font-extrabold text-gray-700">${storeCounts[sm]}</p>
            </div>
        `;
    });
    statsHTML += '</div>';

    statsHTML += '<h3 class="text-xl font-bold text-center mb-4 mt-8">Продукти по категории</h3>';
    statsHTML += `<div class="overflow-x-auto border rounded-lg"><table class="min-w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-2 text-left font-semibold text-gray-600">Категория</th>`;
    mockData.supermarkets.forEach(sm => {
        const colorClass = mockData.supermarketColors[sm] + '-text';
        statsHTML += `<th class="p-2 text-center font-semibold ${colorClass}">${sm}</th>`;
    });
    statsHTML += `</tr></thead><tbody class="divide-y">`;

    mockData.categories.forEach(cat => {
        const categoryStoreCounts = {};
        mockData.supermarkets.forEach(sm => categoryStoreCounts[sm] = 0);
        
        (cat.products || []).forEach(p => {
            mockData.supermarkets.forEach(sm => {
                if (p.offers[sm] && p.offers[sm].promoPrice) categoryStoreCounts[sm]++;
            });
        });

        statsHTML += `<tr class="hover:bg-gray-50">
                        <td class="p-2 font-medium text-gray-800">${cat.name}</td>`;
        mockData.supermarkets.forEach(sm => {
             statsHTML += `<td class="p-2 text-center text-gray-600">${categoryStoreCounts[sm] > 0 ? categoryStoreCounts[sm] : '-'}</td>`;
        });
        statsHTML += `</tr>`;
    });
    
    statsHTML += '</tbody></table></div>';
    footer.innerHTML = statsHTML;
}


// --- СПИСЪК ЗА ПАЗАР ---
function addToShoppingList(productId) {
    const product = findProductById(productId);
    if (!product) return;

    if (shoppingList[productId]) {
        if (product.unitType === 'piece') {
            shoppingList[productId].quantity++;
        } else {
             showToast(`${product.productName} вече е в списъка. Можете да промените количеството.`);
        }
    } else {
        const bestOffer = getBestOffer(product.offers);
        if (bestOffer.price === Infinity) {
            showToast("Продуктът не е наличен в момента.");
            return;
        }
        shoppingList[productId] = {
            product: product,
            quantity: 1,
            selectedStore: bestOffer.store,
            price: bestOffer.price
        };
        showToast(`${product.productName} е добавен в списъка.`);
    }
    updateShoppingList();
}

function updateShoppingList() {
    const itemsContainer = document.getElementById('shopping-list-items');
    const totalPriceEl = document.getElementById('total-price');
    itemsContainer.innerHTML = '';
    let total = 0;

    if (Object.keys(shoppingList).length === 0) {
        itemsContainer.innerHTML = '<p class="text-gray-500">Списъкът за пазар е празен.</p>';
    }

    for (const id in shoppingList) {
        const item = shoppingList[id];
        const itemDiv = document.createElement('div');
        itemDiv.className = 'flex justify-between items-center py-2 border-b gap-2';
        
        let storeOptions = '';
        const offers = item.product.offers;
        for (const store in offers) {
            if (offers[store] && offers[store].promoPrice) {
                const selected = store === item.selectedStore ? 'selected' : '';
                storeOptions += `<option value="${store}" ${selected}>${store} (${offers[store].promoPrice.toFixed(2)} лв.)</option>`;
            }
        }
        
        const unitLabel = item.product.unitType === 'kg' ? 'кг.' : (item.product.unitType === 'liter' ? 'л.' : 'бр.');
        const inputStep = item.product.unitType === 'piece' ? '1' : '0.01';
        const minVal = item.product.unitType === 'piece' ? '1' : '0.01';

        itemDiv.innerHTML = `
            <div class="flex-grow">
                <p class="font-semibold">${item.product.productName}</p>
                <select onchange="updateItemStore('${id}', this.value)" class="text-sm p-1 border rounded">${storeOptions || `<option>Няма оферти</option>`}</select>
            </div>
            <div class="flex items-center">
                <input type="number" min="${minVal}" step="${inputStep}" value="${item.quantity}" onchange="updateQuantity('${id}', this.value)" class="w-20 text-center border rounded mx-2">
                <span class="w-8 text-left text-sm text-gray-600">${unitLabel}</span>
                <span class="w-20 text-right font-medium">${(item.price * item.quantity).toFixed(2)} лв.</span>
                <button onclick="removeFromShoppingList('${id}')" class="ml-2 text-red-500 hover:text-red-700 font-bold text-lg">&times;</button>
            </div>
        `;
        itemsContainer.appendChild(itemDiv);
        total += item.price * item.quantity;
    }

    totalPriceEl.textContent = `${total.toFixed(2)} лв.`;
    updateShoppingListCount();
    document.getElementById('optimization-result').classList.add('hidden');
}

function updateQuantity(productId, quantity) {
    const q = parseFloat(quantity);
    if (shoppingList[productId] && q > 0) {
        shoppingList[productId].quantity = q;
        updateShoppingList();
    } else if (q <= 0) {
        const product = shoppingList[productId].product;
        shoppingList[productId].quantity = product.unitType === 'piece' ? 1 : 0.01;
        showToast("Количеството трябва да е по-голямо от 0.");
        updateShoppingList();
    }
}

function updateItemStore(productId, store) {
    if (shoppingList[productId] && shoppingList[productId].product.offers[store]) {
        const newPrice = shoppingList[productId].product.offers[store].promoPrice;
        shoppingList[productId].selectedStore = store;
        shoppingList[productId].price = newPrice;
        updateShoppingList();
    }
}

function removeFromShoppingList(productId) {
    delete shoppingList[productId];
    updateShoppingList();
}

function updateShoppingListCount() {
    const count = Object.keys(shoppingList).length;
    const countEl = document.getElementById('shopping-list-count');
    countEl.textContent = count;
    countEl.style.display = count > 0 ? 'flex' : 'none';
}

function showShoppingList() {
    updateShoppingList();
    document.getElementById('shopping-list-modal').classList.remove('hidden');
}

function hideShoppingList() {
    document.getElementById('shopping-list-modal').classList.add('hidden');
}

function optimizeBasket() {
    const resultContainer = document.getElementById('optimization-result');
    if (Object.keys(shoppingList).length === 0) {
        resultContainer.innerHTML = '<p>Добавете продукти, за да оптимизирате кошницата.</p>';
        resultContainer.classList.remove('hidden');
        return;
    }

    const optimalBasket = {};
    let grandTotal = 0;

    for (const id in shoppingList) {
        const item = shoppingList[id];
        const bestOffer = getBestOffer(item.product.offers);
        
        if(bestOffer.store) {
            if (!optimalBasket[bestOffer.store]) {
                optimalBasket[bestOffer.store] = { items: [], total: 0 };
            }
            optimalBasket[bestOffer.store].items.push(`- ${item.product.productName} (x${item.quantity})`);
            optimalBasket[bestOffer.store].total += bestOffer.price * item.quantity;
            grandTotal += bestOffer.price * item.quantity;
        }
    }

    let resultHTML = `<h3 class="font-bold mb-2">Най-изгодна кошница (Общо: ${grandTotal.toFixed(2)} лв.):</h3>`;
    for (const store in optimalBasket) {
        const colorClass = mockData.supermarketColors[store] + '-text';
        resultHTML += `<div class="mb-2"><p class="font-semibold ${colorClass}-text">Пазарувай от ${store} (${optimalBasket[store].total.toFixed(2)} лв.):</p>
                       <ul class="list-disc list-inside text-sm text-gray-700">${optimalBasket[store].items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
    }
    resultContainer.innerHTML = resultHTML;
    resultContainer.classList.remove('hidden');
}

function shareList() {
    if (Object.keys(shoppingList).length === 0) {
        showToast("Списъкът е празен, няма какво да се сподели.");
        return;
    }

    let listText = "Списък за пазар от ПромоОферти:\n\n";
    let total = 0;
    for (const id in shoppingList) {
        const item = shoppingList[id];
        const unitLabel = item.product.unitType === 'kg' ? 'кг.' : (item.product.unitType === 'liter' ? 'л.' : 'бр.');
        listText += `- ${item.product.productName} (${item.quantity} ${unitLabel}) от ${item.selectedStore} - ${(item.price * item.quantity).toFixed(2)} лв.\n`;
        total += item.price * item.quantity;
    }
    listText += `\nОбща сума: ${total.toFixed(2)} лв.`;

    const textArea = document.createElement("textarea");
    textArea.value = listText;
    document.body.appendChild(textArea);
    textArea.select();
    try {
        document.execCommand('copy');
        showToast("Списъкът е копиран в клипборда!");
    } catch (err) { showToast("Грешка при копирането."); }
    document.body.removeChild(textArea);
}

// --- ПОМОЩНИ ФУНКЦИИ ---
function findProductById(productId) {
    for (const category of mockData.categories) {
        const product = (category.products || []).find(p => p.productId === productId);
        if (product) return product;
    }
    return null;
}

function getBestOffer(offers) {
    let bestPrice = Infinity, bestStore = null;
    for (const store in offers) {
        if (offers[store] && offers[store].promoPrice) {
            if (offers[store].promoPrice < bestPrice) {
                bestPrice = offers[store].promoPrice;
                bestStore = store;
            }
        }
    }
    return { price: bestPrice, store: bestStore };
}

function getBrochureValidityForStore(category, storeName) {
    const offer = (category.products || []).find(p => p.offers[storeName] && p.offers[storeName].validFrom);
    if (offer) {
        const from = offer.offers[storeName].validFrom.slice(0, 5).replace(/\./g, '/');
        const to = offer.offers[storeName].validTo.slice(0, 5).replace(/\./g, '/');
        return `${from} - ${to}`;
    }
    return '-';
}

function calculateUnitPrice(price, description) {
    const desc = description.toLowerCase();
    if (desc.includes('1 л') || desc.includes('1кг') || desc.includes('1 кг')) {
        return `${price.toFixed(2)} лв./${desc.includes('л') ? 'л' : 'кг'}`;
    }
    const matchKg = desc.match(/(\d+)\s*кг/);
    if (matchKg) {
        const weight = parseInt(matchKg[1], 10);
        return `${(price / weight).toFixed(2)} лв./кг`;
    }
    const matchG = desc.match(/(\d+)\s*г/);
     if (matchG) {
        const weight = parseInt(matchG[1], 10);
        return `${((price / weight) * 1000).toFixed(2)} лв./кг`;
    }
     const matchMl = desc.match(/(\d+)\s*мл/);
     if (matchMl) {
        const volume = parseInt(matchMl[1], 10);
        return `${((price / volume) * 1000).toFixed(2)} лв./л`;
    }
    return null;
}

document.getElementById('search-box').addEventListener('input', (e) => {
    const searchTerm = e.target.value.toLowerCase();
    document.querySelectorAll('#table-body tr').forEach(row => {
        const productName = row.dataset.productName;
        if (productName.includes(searchTerm)) {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
});

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg z-[1001] animate-pulse';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.remove();
    }, 3000);
}

</script>
